name: Publish to npm

on:
  release:
    # `published` (rather than `created`) skips draft releases.
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # Staged publishing (`npm stage`) needs npm >= 11.15.0.
      - run: npm install -g npm@^11.15.0

      # The release tag is the single source of truth for the version; the
      # "version" field committed in package.json is a placeholder (0.0.0).
      # Accepts tags like v1.2.3, 1.2.3 or v1.2.3-beta.1. This must run before
      # the build: tsdown inlines package.json into dist/cli.js for --version.
      - name: Set version from release tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! node -e "process.exit(/^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/.test(process.argv[1]) ? 0 : 1)" "$version"; then
            echo "::error::Release tag '$GITHUB_REF_NAME' is not a semver version (expected e.g. v1.2.3)."
            exit 1
          fi
          npm version "$version" --no-git-tag-version
          echo "Publishing version $version"

      # `prepare` runs tsdown, so this also builds dist/.
      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      # Staged publishing (https://docs.npmjs.com/staged-publishing) requires
      # the package to already exist on the registry. The very first release
      # falls back to a regular `npm publish`; every later release is staged
      # and must be approved with `npm stage approve <stage-id>`.
      #
      # Releases marked as pre-release on GitHub are published under the
      # `next` dist-tag so they don't become the default install.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          pkg="$(node -p "require('./package.json').name")"
          tag_args=()
          if [ "$PRERELEASE" = "true" ]; then
            tag_args=(--tag next)
          fi
          if npm view "$pkg" version >/dev/null 2>&1; then
            npm stage publish "${tag_args[@]}"
          else
            echo "$pkg is not on the registry yet; doing a regular publish."
            npm publish --access public "${tag_args[@]}"
          fi
